<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vector Map - Melegnano</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=20260819" />
    <link rel="stylesheet" href="css/map.css?v=20260819" />
  </head>
  <body>
    <main id="app" aria-label="Mappa operativa del Comune di Melegnano">
      <div id="map"></div>

      <section class="toolbar" aria-label="Controlli mappa">
        <button id="locateButton" class="control-button primary" type="button">
          La mia posizione
        </button>
        <button id="followButton" class="control-button" type="button" aria-pressed="false">
          Segui posizione
        </button>
        <button id="resetButton" class="control-button icon-button" type="button" aria-label="Torna a Melegnano" title="Torna a Melegnano">
          &#8962;
        </button>
      </section>

      <section id="statusPanel" class="status-panel" aria-live="polite">
        <strong>Melegnano</strong>
        <span id="locationStatus">Mappa pronta</span>
      </section>

      <section class="layer-panel" aria-label="Layer">
        <details>
          <summary>Layer</summary>
          <fieldset>
            <legend>Base</legend>
            <label>
              <input name="baseLayer" type="radio" value="cartoVoyager" />
              Voyager
            </label>
            <label>
              <input name="baseLayer" type="radio" value="satellite" checked />
              Satellitare
            </label>
          </fieldset>
          <fieldset>
            <legend>Overlay</legend>
          <label>
            <input id="boundaryLayer" type="checkbox" checked />
            Confine comunale
          </label>
          <label>
            <input id="maskLayer" type="checkbox" checked />
            Evidenzia territorio comunale
          </label>
          </fieldset>
        </details>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js?v=20260819"></script>
    <script src="data/melegnano.js?v=20260819"></script>
    <script src="data/municipalities.js?v=20260819"></script>
    <script src="js/map.js?v=20260819"></script>
  </body>
</html>
