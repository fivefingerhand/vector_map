<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vector Map - Melegnano</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=20260819" />
    <link rel="stylesheet" href="css/map.css?v=20261005a" />
  </head>
  <body>
    <main id="app" aria-label="Mappa operativa del Comune di Melegnano">
      <div id="map"></div>

      <section class="toolbar" aria-label="Controlli mappa">
        <button id="locateButton" class="control-button primary" type="button">
          La mia posizione
        </button>
        <button id="followButton" class="control-button" type="button" aria-pressed="false">
          Segui posizione
        </button>
        <button id="copyCoordinateButton" class="control-button" type="button" disabled>
          Copia punto
        </button>
        <button id="resetButton" class="control-button icon-button" type="button" aria-label="Torna a Melegnano" title="Torna a Melegnano">
          &#8962;
        </button>
      </section>

      <section id="statusPanel" class="status-panel" aria-live="polite">
        <strong>Melegnano</strong>
        <span id="locationStatus">Mappa pronta</span>
      </section>

      <button
        id="layerToggleButton"
        class="layer-toggle"
        type="button"
        aria-label="Apri selezione livelli"
        aria-expanded="false"
        aria-controls="layerQuickPanel"
      >
        <svg class="layer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" />
          <path d="M5.5 11 3 12.25 12 17l9-4.75L18.5 11" />
          <path d="M5.5 15.5 3 16.75 12 21l9-4.25-2.5-1.25" />
        </svg>
        <span>Livelli</span>
      </button>

      <button
        id="measureToolButton"
        class="layer-toggle measure-toggle"
        type="button"
        aria-label="Attiva misura"
        aria-pressed="false"
      >
        <svg class="measure-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 17.5 17.5 5" />
          <path d="M7.5 15 9 16.5" />
          <path d="M10.5 12 12 13.5" />
          <path d="M13.5 9 15 10.5" />
          <circle cx="5" cy="17.5" r="2.4" />
          <circle cx="17.5" cy="5" r="2.4" />
        </svg>
        <span>Misura</span>
      </button>

      <section id="layerQuickPanel" class="layer-quick-panel layer-menu-panel" aria-label="Selezione rapida livelli" hidden>
        <button class="map-tile base-tile preview-esri" type="button" data-base-layer="satellite" aria-pressed="true">
          <span class="selection-mark" aria-hidden="true">&#10003;</span>
          <span class="tile-preview" aria-hidden="true"></span>
          <span class="tile-name">Satellite</span>
        </button>
        <button class="map-tile base-tile preview-road" type="button" data-base-layer="roadVoyager" aria-pressed="false">
          <span class="selection-mark" aria-hidden="true">&#10003;</span>
          <span class="tile-preview" aria-hidden="true"></span>
          <span class="tile-name">Stradale</span>
        </button>
        <button class="map-tile base-tile preview-osm" type="button" data-base-layer="roadOsm" aria-pressed="false">
          <span class="selection-mark" aria-hidden="true">&#10003;</span>
          <span class="tile-preview" aria-hidden="true"></span>
          <span class="tile-name">Stradale OSM</span>
        </button>
        <button id="openLayerDetailsButton" class="map-tile more-tile" type="button" aria-label="Apri dettagli mappa">
          <span class="tile-preview layers-preview" aria-hidden="true">
            <svg class="layer-icon" viewBox="0 0 24 24" focusable="false">
              <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" />
              <path d="M5.5 11 3 12.25 12 17l9-4.75L18.5 11" />
              <path d="M5.5 15.5 3 16.75 12 21l9-4.25-2.5-1.25" />
            </svg>
          </span>
          <span class="tile-name">Altro</span>
        </button>
      </section>

      <section
        id="layerDetailsPanel"
        class="layer-details-panel layer-menu-panel"
        aria-labelledby="layerDetailsTitle"
        hidden
      >
        <header class="details-header">
          <button id="backToBaseLayersButton" class="panel-back-button" type="button" aria-label="Torna alla selezione basi">
            Indietro
          </button>
          <h2 id="layerDetailsTitle">Dettagli mappa</h2>
          <button id="closeLayerDetailsButton" class="panel-close-button" type="button" aria-label="Chiudi dettagli mappa">
            &times;
          </button>
        </header>

        <div class="details-content">
          <section class="details-section" aria-labelledby="overlaySectionTitle">
            <h3 id="overlaySectionTitle">Livelli</h3>
            <div class="detail-tile-grid">
              <button class="map-tile detail-tile overlay-tile preview-boundary" type="button" data-overlay-layer="operationalBoundary" aria-pressed="true">
                <span class="selection-mark" aria-hidden="true">&#10003;</span>
                <span class="tile-preview" aria-hidden="true"></span>
                <span class="tile-name">Confine</span>
                <span class="sr-only">Confine amministrativo DBT Regione Lombardia 2022</span>
              </button>
              <button class="map-tile detail-tile overlay-tile preview-regional-boundary" type="button" data-overlay-layer="regionalBoundary" aria-pressed="false">
                <span class="selection-mark" aria-hidden="true">&#10003;</span>
                <span class="tile-preview" aria-hidden="true"></span>
                <span class="tile-name">Confine RL 2011</span>
                <span class="sr-only">Confine amministrativo Regione Lombardia 2011, confronto</span>
              </button>
              <button class="map-tile detail-tile overlay-tile preview-mask" type="button" data-overlay-layer="mask" aria-pressed="true">
                <span class="selection-mark" aria-hidden="true">&#10003;</span>
                <span class="tile-preview" aria-hidden="true"></span>
                <span class="tile-name">Evidenzia</span>
                <span class="sr-only">Evidenzia territorio comunale</span>
              </button>
            </div>
          </section>
        </div>
      </section>

      <section id="measureHud" class="measure-hud" aria-live="polite" hidden>
        <span>Misura</span>
        <strong id="measureHudDistance">0 m</strong>
        <div class="measure-actions">
          <button class="small-action-button finish-measure-action" type="button">Fine</button>
          <button class="small-action-button clear-measure-action" type="button">Elimina</button>
        </div>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js?v=20260819"></script>
    <script src="data/melegnano-boundary.js?v=20261006"></script>
    <script src="data/regional_boundary_melegnano.js?v=20261005"></script>
    <script src="js/map.js?v=20261006"></script>
  </body>
</html>
